apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress-frontend
  namespace: dev

spec:
  replicas: 4

  selector:
    matchLabels:
      app: wordpress-frontend

  template:
    metadata:
      labels:
        app: wordpress-frontend

    spec:
      containers:
        - name: wordpress
          image: wordpress:latest

          env:
            - name: WORDPRESS_DB_HOST
              value: mysql:3306

          envFrom:
            - secretRef:
                name: wordpress-secret

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
