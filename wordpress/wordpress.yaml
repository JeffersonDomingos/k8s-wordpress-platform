apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: dev

spec:
  replicas: 1

  selector:
    matchLabels:
      app: wordpress

  template:
    metadata:
      labels:
        app: wordpress

    spec:
      containers:
        - name: wordpress
          image: wordpress:latest

          env:
            - name: WORDPRESS_DB_HOST
              value: mysql:3306

          envFrom:
            - secretRef:
                name: wordpress-secret

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10